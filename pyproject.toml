[project]
name = "aroundyou-backend"
version = "0.1.0"
description = "FastAPI backend for Aroundyou (City Discovery App)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.1.1",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "geoalchemy2>=0.15.2",
  "psycopg[binary]>=3.2.1",
  "redis>=5.0.8",
  "qdrant-client>=1.10.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.22",
  "google-auth>=2.35.0",
  "requests>=2.32.5",
  "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
